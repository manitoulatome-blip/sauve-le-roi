<script>
const COLS=8,ROWS=10;
const COL=[['#ff6b7d','#c2183a'],['#ffd84a','#e09100'],['#55b3ff','#1e5fd1'],['#62dc66','#1f9033'],['#c986ff','#7d2fc9']];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let dg=0,S=40,W=0,H=0,dpr=1,level=1,moves=0,score=0,grid=[],ghosts=[],parts=[],texts=[],busy=true,over=true,king=null,shake=0,ncol=3,killed=0,AC=null,T=0,toast=null;
try{level=Math.max(1,+localStorage.getItem('slr_level')||1)}catch(e){}
const TH=[{n:'Château',a:'#3b2b48',b:'#241a2e',g:'#4a3360',bg:'#1d1424'},{n:'Forêt',a:'#2f5a3a',b:'#14301f',g:'#2f6b45',bg:'#0f2218'},{n:'Espace',a:'#2a2a6a',b:'#0b0b26',g:'#3a2f8a',bg:'#070716'},{n:'Océan',a:'#1f6f8f',b:'#0b2f4a',g:'#2a8fb0',bg:'#071e30'}];
let th=0,mode=0,best=0,carry=0,advLv=1,muted=0,maxLv=1,stars={};
const fx=$('fx'),fc=fx.getContext('2d'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let FW=0,FH=0;
const DK=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),r:Math.random(),v:.4+Math.random()*.8}));
function fxResize(){FW=innerWidth;FH=innerHeight;fx.width=Math.round(FW*dpr);fx.height=Math.round(FH*dpr)}
function fxFrame(dt){
  fc.setTransform(dpr,0,0,dpr,0,0);fc.clearRect(0,0,FW,FH);if(RM)return;
  for(let i=0;i<DK.length;i++){const p=DK[i],x=p.x*FW,y=p.y*FH,s=1.5+p.r*3.5;
    if(th===0){p.y-=p.v*.07*dt;p.x+=Math.sin(T*1.5+p.r*20)*.02*dt;fc.fillStyle='rgba(255,'+(140+p.r*80|0)+',60,'+(.25+.35*Math.abs(Math.sin(T*2+i)))+')';fc.beginPath();fc.arc(x,y,s*.8,0,6.283);fc.fill()}
    else if(th===1){p.y+=p.v*.06*dt;p.x+=Math.sin(T+p.r*20)*.03*dt;fc.save();fc.translate(x,y);fc.rotate(T*p.v+p.r*6);fc.fillStyle=['#7fcf5a','#c9d94a','#4f9a3a'][i%3]+'bb';fc.beginPath();fc.ellipse(0,0,s*2,s,0,0,6.283);fc.fill();fc.restore()}
    else if(th===2){p.y+=p.v*.008*dt;fc.fillStyle='rgba(255,255,255,'+(.25+.6*Math.abs(Math.sin(T*1.5*p.v+i)))+')';fc.beginPath();fc.arc(x,y,s*.5,0,6.283);fc.fill()}
    else{p.y-=p.v*.08*dt;p.x+=Math.sin(T*2+p.r*20)*.015*dt;fc.strokeStyle='rgba(190,235,255,.5)';fc.lineWidth=1.2;fc.beginPath();fc.arc(x,y,s*1.4,0,6.283);fc.stroke()}
    if(p.y<-.05)p.y=1.05;else if(p.y>1.05)p.y=-.05;
    if(p.x<-.05)p.x=1.05;else if(p.x>1.05)p.x=-.05}
}
function openMap(){
  ea();if(busy&&!over)return;
  if(mode){mode=0;level=advLv;score=0;carry=0;over=true}
  const m=$('map');m.innerHTML='';
  const total=Math.max(12,Math.ceil((maxLv+3)/4)*4);
  for(let n=1;n<=total;n++){const b=document.createElement('button');b.innerHTML=n<=maxLv?'<span>'+n+'</span><small>'+(stars[n]?'★'.repeat(stars[n])+'☆'.repeat(3-stars[n]):'&nbsp;')+'</small>':'🔒';b.disabled=n>maxLv;if(n===maxLv)b.className='cur';
    b.onclick=()=>{ea();m.style.display='none';$('ov').classList.add('off');level=n;score=0;carry=0;newLevel()};m.appendChild(b)}
  $('ot').textContent='Niveaux';$('os').textContent='';$('om').textContent='Choisis un niveau à rejouer ou continue ta partie.';$('go').textContent='Fermer';
  $('go').onclick=()=>{m.style.display='none';$('ov').classList.add('off');if(over)newLevel()};
  m.style.display='grid';$('ov').classList.remove('off');
}
try{th=(+localStorage.getItem('slr_theme')||0)%TH.length;best=+localStorage.getItem('slr_best')||0;muted=+localStorage.getItem('slr_mute')||0;maxLv=Math.max(level,+localStorage.getItem('slr_max')||1);stars=JSON.parse(localStorage.getItem('slr_stars')||'{}')}catch(e){}
function applyTh(){const s=document.documentElement.style;s.setProperty('--bg',TH[th].bg);s.setProperty('--glow',TH[th].g)}
function opts(){$('bs').textContent=muted?'🔇':'🔊';$('bt').textContent='🎨 '+TH[th].n;$('bm').textContent=mode?'♾️ Sans fin · '+best:'🏰 Aventure'}
$('bt').onclick=()=>{ea();th=(th+1)%TH.length;try{localStorage.setItem('slr_theme',th)}catch(e){}applyTh();opts()};
$('bs').onclick=()=>{muted=muted?0:1;try{localStorage.setItem('slr_mute',muted)}catch(e){}ea();opts();tone(600,.1)};
$('bl').onclick=openMap;
$('bm').onclick=()=>{ea();if(mode){mode=0;level=advLv}else{mode=1;advLv=level;level=1}score=0;carry=0;$('ov').classList.add('off');newLevel()};
applyTh();
const rnd=n=>Math.floor(Math.random()*n);

function resize(){
  const maxW=Math.min(innerWidth-16,460),maxH=innerHeight-235;
  S=Math.max(24,Math.floor(Math.min(maxW/COLS,maxH/ROWS)));
  W=S*COLS;H=S*ROWS;dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';fxResize();
}
addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
function ea(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d=.12,type='sine',v=.07,to=0){
  if(!AC||muted)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- niveau ---------- */
const mk=(t,c,r,o)=>Object.assign({t,x:c,y:r,ty:r,vy:0,sq:0,sh:0,fl:0,hp:1,col:0},o);
function hasMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=grid[r][c];if(!x)continue;
    if(x.t==='b'||x.t==='f'||x.t==='w')return true;
    if(x.t==='g'){const R=grid[r][c+1],D=grid[r+1]&&grid[r+1][c];
      if((R&&R.t==='g'&&R.col===x.col)||(D&&D.t==='g'&&D.col===x.col))return true}}
  return false;
}
function newLevel(){
  ncol=level<3?3:level<6?4:5;
  do{
    grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)grid[r][c]=mk('g',c,r,{col:rnd(ncol)});
    const kc=1+rnd(COLS-2);
    grid[1][kc]=king=mk('k',kc,1);
    let n=Math.min(5+Math.floor(level*1.4),Math.min(20,14+Math.floor(Math.max(0,level-10)/2))),tries=0,sp=level>=3?Math.min(1+Math.floor((level-1)/3),level>=10?6:4):0;
    while(sp>0&&tries++<300){const r=3+rnd(6),c=rnd(COLS);if(grid[r][c].t==='g'){grid[r][c]=mk('s',c,r);sp--}}
    tries=0;
    while(n>0&&tries++<300){const r=rnd(6),c=rnd(COLS);
      if(grid[r][c].t==='g'){grid[r][c]=mk('r',c,r,{hp:(level>=5&&Math.random()<Math.min(level>=10?.45:.3,(level-4)*.05))?2:1});n--}}
  }while(!hasMove());
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=grid[r][c];x.y=r-ROWS-2-Math.random()*3;x.vy=0}
  ghosts=[];parts=[];texts=[];
  moves=(mode?Math.max(10,13-Math.floor(level/4)):(level<10?Math.min(24,15+Math.floor(level*.8)):Math.max(15,21-Math.floor((level-10)*.5))))+(mode?carry:0);score=score||0;dg=dgMax();
  busy=true;over=false;hud();
}
function hud(){$('hl').textContent=level;$('hm').textContent=moves;$('hs').textContent=score;$('hd').textContent=level>=2?dg:'–';$('dp').classList.toggle('warn',level>=2&&dg===1);opts()}

/* ---------- mécanique ---------- */
function flood(r,c){
  const col=grid[r][c].col,seen=new Set([r*COLS+c]),st=[[r,c]],out=[];
  while(st.length){const [a,b]=st.pop();out.push([a,b]);
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const y=a+dr,x=b+dc;if(y<0||x<0||y>=ROWS||x>=COLS)continue;
      const n=grid[y][x];if(n&&n.t==='g'&&n.col===col&&!seen.has(y*COLS+x)){seen.add(y*COLS+x);st.push([y,x])}}}
  return out;
}
function kill(r,c){
  const x=grid[r][c];if(!x||x.t==='k')return;grid[r][c]=null;killed++;
  ghosts.push({t:x.t,col:x.col,hp:x.hp,x:x.x,y:x.y,sq:0,sh:0,fl:0,life:1});
  const p=x.t==='g'?COL[x.col][0]:x.t==='r'?'#a4aab7':'#ffb347';
  for(let i=0;i<9;i++){const a=Math.random()*6.283,v=90+Math.random()*230;
    parts.push({x:(x.x+.5)*S,y:(x.y+.5)*S,vx:Math.cos(a)*v,vy:Math.sin(a)*v-130,l:1,c:p,s:S*(.07+Math.random()*.09)})}
}
function hurt(r,c,d){
  const x=grid[r]&&grid[r][c];if(!x||(x.t!=='r'&&x.t!=='s'))return;
  x.hp-=d;if(x.hp<=0)kill(r,c);else{x.fl=1;x.sh=1}
}
function explode(r,c){
  const q=[[r,c]],seen=new Set([r*COLS+c]);
  while(q.length){const [rr,cc]=q.shift();
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const a=rr+dr,b=cc+dc;if(a<0||b<0||a>=ROWS||b>=COLS)continue;
      const t=grid[a][b];if(!t)continue;
      if(t.t==='b'){if(!seen.has(a*COLS+b)){seen.add(a*COLS+b);q.push([a,b])}}
      else if(t.t==='g'||t.t==='f'||t.t==='w')kill(a,b);else if(t.t==='r'||t.t==='s')hurt(a,b,2)}
    kill(rr,cc)}
  shake=1;tone(90,.35,'sawtooth',.12,40);buzz(60);
}
function gravity(){
  for(let c=0;c<COLS;c++){let w=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){const x=grid[r][c];if(!x)continue;
      if(w!==r){grid[w][c]=x;grid[r][c]=null}x.ty=w;w--}}
}
function play(r,c){
  const x=grid[r]&&grid[r][c];if(!x)return;
  killed=0;
  if(x.t==='b')explode(r,c);else if(x.t==='f')rocket(r,c);else if(x.t==='w')rainbow(r,c);
  else if(x.t==='g'){
    const g=flood(r,c);
    if(g.length<2){x.sh=1;tone(130,.12,'square',.05);return}
    const bt=g.length>=8?'w':g.length>=6?'b':g.length>=4?'f':null,bomb=!!bt;
    for(const [a,b] of g){if(bomb&&a===r&&b===c)continue;kill(a,b)}
    const hit=new Set();
    for(const [a,b] of g)for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const y=a+dr,xx=b+dc,k=y*COLS+xx;
      if(y>=0&&xx>=0&&y<ROWS&&xx<COLS&&!hit.has(k)){hit.add(k);hurt(y,xx,1)}}
    if(bomb){grid[r][c]=null;kill(r,c);const bb=mk(bt,c,r);bb.sq=.8;grid[r][c]=bb;killed--}
    tone(300+Math.min(g.length,10)*55,.14,'triangle',.09,500+Math.min(g.length,10)*70);buzz(15);
  }else return;
  const gain=killed*10+(killed>=6?killed*5:0);score+=gain;
  texts.push({x:(c+.5)*S,y:(r+.5)*S,s:'+'+gain,l:1});
  moves--;busy=true;gravity();if(level>=2){dg--;if(dg<=0){dg=dgMax();breath()}}hud();
}
function rocket(r,c){
  for(let a=0;a<ROWS;a++){const x=grid[a][c];if(!x)continue;
    if(x.t==='r')hurt(a,c,2);else kill(a,c);
    for(const d of[-1,1])hurt(a,c+d,1)}
  for(let i=0;i<18;i++)parts.push({x:(c+.5)*S,y:(r+.5)*S,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*700,l:1,c:Math.random()<.5?'#ff7a1a':'#ffe45e',s:S*.12});
  shake=.8;tone(240,.4,'sawtooth',.1,900);buzz(50);
}
function rainbow(r,c){
  kill(r,c);const cnt=[0,0,0,0,0],hit=[],seen=new Set();
  for(const row of grid)for(const x of row)if(x&&x.t==='g')cnt[x.col]++;
  const m=cnt.indexOf(Math.max(...cnt));
  for(let a=0;a<ROWS;a++)for(let b=0;b<COLS;b++){const x=grid[a][b];if(x&&x.t==='g'&&x.col===m){kill(a,b);hit.push([a,b])}}
  for(const [a,b] of hit)for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const y=a+dr,xx=b+dc,k=y*COLS+xx;if(!seen.has(k)){seen.add(k);hurt(y,xx,1)}}
  shake=.7;tone(500,.5,'triangle',.1,1500);buzz(40);
}
function dgMax(){return Math.max(3,6-Math.floor(level/5))}
function breath(){
  const n=level>=14?4:level>=8?3:2,cols=[];
  toast={s:'Le dragon crache !',l:1.4};tone(160,.5,'sawtooth',.1,60);buzz([60,40,60]);shake=.6;
  while(cols.length<n){const c=rnd(COLS);if(!cols.includes(c))cols.push(c)}
  for(const c of cols){
    for(let i=0;i<14;i++)parts.push({x:(c+.5)*S+(Math.random()-.5)*S*.5,y:Math.random()*S,vx:(Math.random()-.5)*60,vy:60+Math.random()*200,l:1,c:Math.random()<.5?'#ff7a1a':'#ffd84a',s:S*(.08+Math.random()*.1)});
    for(let r=0;r<ROWS;r++){const x=grid[r][c];if(!x)continue;
      if(x.t==='g'){x.t='r';x.hp=1;x.fl=1;x.sq=.6}
      break}
  }
}
function drawDragon(){
  const x=W-S*.7,y=S*.05,s=S*.85,f=dg===1?1+Math.sin(T*14)*.08:1;
  ctx.save();ctx.translate(x,y);ctx.scale(f,f);ctx.globalAlpha=.92;
  if(dg===1){ctx.fillStyle='#ff7a1a66';ctx.beginPath();ctx.arc(0,s*.4,s*.5,0,6.283);ctx.fill()}
  ctx.fillStyle='#f2e2b0';for(const d of[-1,1]){ctx.beginPath();ctx.moveTo(d*s*.2,-s*.25);ctx.lineTo(d*s*.5,-s*.62);ctx.lineTo(d*s*.42,-s*.15);ctx.closePath();ctx.fill()}
  ctx.fillStyle='#4f9a3a';ctx.beginPath();ctx.ellipse(0,0,s*.52,s*.42,0,0,6.283);ctx.fill();
  ctx.fillStyle='#7fcf5a';ctx.beginPath();ctx.ellipse(0,s*.18,s*.34,s*.2,0,0,6.283);ctx.fill();
  ctx.fillStyle='#ffe45e';for(const d of[-1,1]){ctx.beginPath();ctx.arc(d*s*.22,-s*.08,s*.1,0,6.283);ctx.fill()}
  ctx.fillStyle='#111';for(const d of[-1,1]){ctx.beginPath();ctx.ellipse(d*s*.22,-s*.08,s*.03,s*.08,0,0,6.283);ctx.fill()}
  ctx.fillStyle='#2d5e22';for(const d of[-1,1]){ctx.beginPath();ctx.arc(d*s*.09,s*.17,s*.04,0,6.283);ctx.fill()}
  ctx.restore();
}
function shuffle(){
  const gs=[];for(const row of grid)for(const x of row)if(x&&x.t==='g')gs.push(x);
  for(const g of gs){g.col=rnd(ncol);g.sq=.8}
  if(!hasMove()){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-1;c++){const a=grid[r][c],b=grid[r][c+1];
    if(a&&b&&a.t==='g'&&b.t==='g'){b.col=a.col;r=ROWS;break}}}
  toast={s:'Mélange !',l:1.2};tone(400,.25,'sine',.07,800);
  if(!hasMove())lose();else busy=false;
}
function after(){
  if(king.ty>=ROWS-1){win();return}
  const bl=grid[king.ty+1]&&grid[king.ty+1][king.x];
  if(bl&&bl.t==='s'){shake=1;lose('Aïe ! Le roi est tombé sur des pics. Détruis-les avant qu’il n’arrive dessus !');return}
  if(moves<=0){lose();return}
  if(!hasMove()){shuffle();return}
  busy=false;
}

/* ---------- fin de niveau ---------- */
function showOv(t,stars,msg,btn,fn){$('map').style.display='none';
  $('ot').textContent=t;$('os').textContent=stars;$('om').textContent=msg;$('go').textContent=btn;
  $('go').onclick=()=>{ea();$('ov').classList.add('off');fn()};$('ov').classList.remove('off');if(t!=='Sauve le Roi !')loadNat();
}
function win(){
  over=true;const st=moves>=6?3:moves>=3?2:1;
  score+=moves*20;if(mode){carry=Math.min(moves,12);if(score>best){best=score;try{localStorage.setItem('slr_best',best)}catch(e){}}}hud();if(!mode){stars[level]=Math.max(stars[level]||0,st);try{localStorage.setItem('slr_stars',JSON.stringify(stars))}catch(e){}}level++;if(!mode){maxLv=Math.max(maxLv,level);try{localStorage.setItem('slr_level',level);localStorage.setItem('slr_max',maxLv)}catch(e){}}
  for(let i=0;i<70;i++)parts.push({x:W/2,y:H*.45,vx:(Math.random()-.5)*620,vy:-200-Math.random()*520,l:1.6,c:COL[rnd(5)][0],s:S*(.08+Math.random()*.1)});
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.09),i*110));buzz([40,40,80]);
  setTimeout(()=>mode?(toast={s:'Niveau '+level+' !',l:1.2},newLevel()):showOv('Roi sauvé !','★'.repeat(st)+'☆'.repeat(3-st),'Bien joué ! Il te reste '+moves+' coup'+(moves>1?'s':'')+'.','Niveau suivant',()=>{newLevel()}),900);
}
function lose(m){if(mode&&score>best){best=score;try{localStorage.setItem('slr_best',best)}catch(e){}}
  over=true;tone(200,.5,'sawtooth',.09,70);buzz(150);
  setTimeout(()=>showOv('Raté…','',(m||'Plus de coups : le roi est resté coincé. Essaie une autre approche !')+(mode?' Score '+score+' · Record '+best:''),'Réessayer',()=>{score=0;carry=0;if(mode)level=1;newLevel()}),500);
}

/* ---------- dessin ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function lg(y0,y1,a,b){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function sym(col,s){
  const u=s*.34;ctx.beginPath();
  if(col===0){ctx.moveTo(0,-u*1.15);ctx.lineTo(u,0);ctx.lineTo(0,u*1.15);ctx.lineTo(-u,0);ctx.closePath()}
  else if(col===1)ctx.arc(0,0,u*.98,0,6.283);
  else if(col===2){rr(-u*.85,-u*.85,u*1.7,u*1.7,u*.3)}
  else if(col===3){ctx.moveTo(0,-u*1.05);ctx.lineTo(u*1.1,u*.85);ctx.lineTo(-u*1.1,u*.85);ctx.closePath()}
  else{for(let i=0;i<10;i++){const a=-1.5708+i*.6283,r=i%2?u*.52:u*1.15;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath()}
  ctx.fillStyle=lg(-u,u,COL[col][0],COL[col][1]);ctx.fill();
  ctx.lineWidth=s*.04;ctx.strokeStyle=COL[col][1];ctx.stroke();
  ctx.fillStyle='#ffffff88';ctx.beginPath();ctx.ellipse(-u*.35,-u*.4,u*.28,u*.16,-.6,0,6.283);ctx.fill();
}
function drawCell(o,cx,cy,sc,al){
  ctx.save();ctx.translate(cx,cy);ctx.scale(sc*(1+o.sq*.14),sc*(1-o.sq*.14));ctx.globalAlpha=al;
  if(o.sh)ctx.translate(Math.sin(o.sh*28)*S*.05,0);
  const s=S*.93,h=s/2;
  if(o.t==='g'){rr(-h,-h,s,s,s*.22);ctx.fillStyle=lg(-h,h,'#fff3d6','#e6cb98');ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#00000030';ctx.stroke();sym(o.col,s)}
  else if(o.t==='r'){
    rr(-h,-h,s,s,s*.34);ctx.fillStyle=lg(-h,h,o.hp>1?'#7a8092':'#9aa1b0',o.hp>1?'#3f4452':'#585e6d');ctx.fill();
    ctx.lineWidth=o.hp>1?s*.07:2;ctx.strokeStyle=o.hp>1?'#d4d9e6':'#00000040';ctx.stroke();
    ctx.fillStyle='#00000030';for(const [a,b] of [[-.2,-.15],[.17,.2],[.22,-.22],[-.15,.24],[.02,0]]){ctx.beginPath();ctx.arc(a*s,b*s,s*.06,0,6.283);ctx.fill()}
    if(o.fl>0){rr(-h,-h,s,s,s*.34);ctx.fillStyle='rgba(255,255,255,'+o.fl*.7+')';ctx.fill()}
  }else if(o.t==='b'){
    const p=1+Math.sin(T*9)*.06;ctx.scale(p,p);
    ctx.fillStyle='#ffb34755';ctx.beginPath();ctx.arc(0,0,s*.52,0,6.283);ctx.fill();
    const g=ctx.createRadialGradient(-s*.1,-s*.1,s*.04,0,0,s*.38);g.addColorStop(0,'#6a6f80');g.addColorStop(1,'#14151c');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,s*.04,s*.34,0,6.283);ctx.fill();
    ctx.strokeStyle='#c9a15a';ctx.lineWidth=s*.05;ctx.beginPath();ctx.moveTo(s*.12,-s*.26);ctx.quadraticCurveTo(s*.22,-s*.42,s*.3,-s*.36);ctx.stroke();
    ctx.fillStyle=Math.sin(T*25)>0?'#ffe45e':'#ff7a1a';ctx.beginPath();ctx.arc(s*.3,-s*.36,s*.07,0,6.283);ctx.fill();
  }else if(o.t==='f'){
    const p=1+Math.sin(T*9)*.05;ctx.scale(p,p);
    ctx.fillStyle='#ffb34755';ctx.beginPath();ctx.arc(0,0,s*.5,0,6.283);ctx.fill();
    ctx.fillStyle=Math.sin(T*30)>0?'#ffe45e':'#ff7a1a';ctx.beginPath();ctx.moveTo(-s*.1,s*.3);ctx.lineTo(0,s*.5);ctx.lineTo(s*.1,s*.3);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e8394d';for(const d of[-1,1]){ctx.beginPath();ctx.moveTo(d*s*.12,s*.08);ctx.lineTo(d*s*.3,s*.34);ctx.lineTo(d*s*.12,s*.3);ctx.closePath();ctx.fill()}
    rr(-s*.14,-s*.28,s*.28,s*.6,s*.12);ctx.fillStyle='#f4f0e6';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#00000040';ctx.stroke();
    ctx.fillStyle='#e8394d';ctx.beginPath();ctx.moveTo(-s*.14,-s*.18);ctx.lineTo(0,-s*.46);ctx.lineTo(s*.14,-s*.18);ctx.closePath();ctx.fill();
    ctx.fillStyle='#55b3ff';ctx.beginPath();ctx.arc(0,0,s*.07,0,6.283);ctx.fill();
  }else if(o.t==='w'){
    ctx.fillStyle='#ffffff44';ctx.beginPath();ctx.arc(0,0,s*.5,0,6.283);ctx.fill();
    ctx.rotate(T*1.6);for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,s*.36,i*1.2566,(i+1)*1.2566);ctx.closePath();ctx.fillStyle=COL[i][0];ctx.fill()}
    ctx.rotate(-T*1.6);ctx.lineWidth=s*.05;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(0,0,s*.36,0,6.283);ctx.stroke();
    ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(-s*.12,-s*.14,s*.08,s*.05,-.6,0,6.283);ctx.fill();
  }else if(o.t==='s'){
    rr(-h,-h,s,s,s*.18);ctx.fillStyle=lg(-h,h,'#4a3f55','#2a2231');ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#ff5a6e99';ctx.stroke();
    ctx.fillStyle=lg(-h,h*.6,'#f2f5fb','#8e96a8');
    for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*s*.28-s*.12,s*.3);ctx.lineTo(i*s*.28,-s*.3);ctx.lineTo(i*s*.28+s*.12,s*.3);ctx.closePath();ctx.fill()}
    ctx.fillStyle='#ff5a6e';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*s*.28,-s*.3,s*.03,0,6.283);ctx.fill()}
  }else if(o.t==='k'){
    ctx.scale(1.08,1.08);
    ctx.fillStyle='#e43c52';rr(-s*.3,-s*.02,s*.6,s*.44,s*.12);ctx.fill();
    ctx.fillStyle='#f3efe6';ctx.beginPath();ctx.ellipse(0,s*.15,s*.25,s*.2,0,0,6.283);ctx.fill();
    ctx.fillStyle='#f4c18a';ctx.beginPath();ctx.arc(0,-s*.02,s*.22,0,6.283);ctx.fill();
    ctx.fillStyle='#7a4a24';for(const d of[-1,1]){ctx.beginPath();ctx.ellipse(d*s*.08,s*.08,s*.09,s*.045,d*.4,0,6.283);ctx.fill()}
    ctx.fillStyle='#e9a070';ctx.beginPath();ctx.arc(0,s*.03,s*.045,0,6.283);ctx.fill();
    ctx.fillStyle='#fff';for(const d of[-1,1]){ctx.beginPath();ctx.arc(d*s*.085,-s*.05,s*.04,0,6.283);ctx.fill()}
    ctx.fillStyle='#222';for(const d of[-1,1]){ctx.beginPath();ctx.arc(d*s*.085,-s*.045,s*.02,0,6.283);ctx.fill()}
    ctx.beginPath();ctx.moveTo(-s*.22,-s*.14);ctx.lineTo(-s*.26,-s*.4);ctx.lineTo(-s*.12,-s*.29);ctx.lineTo(0,-s*.44);ctx.lineTo(s*.12,-s*.29);ctx.lineTo(s*.26,-s*.4);ctx.lineTo(s*.22,-s*.14);ctx.closePath();
    ctx.fillStyle=lg(-s*.4,-s*.1,'#ffe066','#f0a000');ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#a86200';ctx.stroke();
    ctx.fillStyle='#e8234a';ctx.beginPath();ctx.arc(0,-s*.2,s*.04,0,6.283);ctx.fill();
  }
  ctx.restore();
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=lg(0,H,TH[th].a,TH[th].b);ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#ffffff0d';ctx.lineWidth=1;
  for(let r=1;r<ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*S);ctx.lineTo(W,r*S);ctx.stroke()}
  ctx.fillStyle='#ffc83d22';ctx.fillRect(0,(ROWS-1)*S,W,S);
  ctx.fillStyle='#ffc83d';ctx.fillRect(0,(ROWS-1)*S,W,2);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*9,(Math.random()-.5)*shake*9);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=grid[r][c];if(x&&x.t!=='k')drawCell(x,(x.x+.5)*S,(x.y+.5)*S,1,1)}
  if(king)drawCell(king,(king.x+.5)*S,(king.y+.5)*S,1,1);
  for(const g of ghosts)drawCell(g,(g.x+.5)*S,(g.y+.5)*S,Math.max(.01,g.life*1.15),Math.max(0,g.life));
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.l));ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
  ctx.globalAlpha=1;
  ctx.font=Math.floor(S*.5)+'px "Lilita One",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  if(level>=2&&!over)drawDragon();
  ctx.globalAlpha=1;
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.l*1.5);ctx.lineWidth=4;ctx.strokeStyle='#4a2a00';ctx.strokeText(t.s,t.x,t.y-(1-t.l)*S*1.2);ctx.fillStyle='#ffe066';ctx.fillText(t.s,t.x,t.y-(1-t.l)*S*1.2)}
  if(toast){ctx.globalAlpha=Math.min(1,toast.l*2);ctx.font=Math.floor(S*.9)+'px "Lilita One",system-ui,sans-serif';ctx.lineWidth=6;ctx.strokeStyle='#4a2a00';ctx.strokeText(toast.s,W/2,H/2);ctx.fillStyle='#fff4dc';ctx.fillText(toast.s,W/2,H/2)}
  ctx.globalAlpha=1;ctx.restore();
}

/* ---------- boucle ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;
  let moving=false;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=grid[r][c];if(!x)continue;
    if(x.y<x.ty){moving=true;x.vy+=70*dt;x.y+=x.vy*dt;
      if(x.y>=x.ty){x.y=x.ty;if(x.vy>7){x.sq=.7;if(x.t==='k')tone(110,.12,'sine',.1)}x.vy=0}}
    if(x.sq>0)x.sq=Math.max(0,x.sq-dt*4);
    if(x.sh>0)x.sh=Math.max(0,x.sh-dt*3);
    if(x.fl>0)x.fl=Math.max(0,x.fl-dt*3)}
  for(const g of ghosts)g.life-=dt*5;ghosts=ghosts.filter(g=>g.life>0);
  for(const p of parts){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.6}parts=parts.filter(p=>p.l>0&&p.y<H+50);
  for(const t of texts)t.l-=dt*1.1;texts=texts.filter(t=>t.l>0);
  if(toast){toast.l-=dt;if(toast.l<=0)toast=null}
  if(shake>0)shake=Math.max(0,shake-dt*3);
  if(busy&&!over&&!moving&&!ghosts.length)after();
  fxFrame(dt);draw();requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',e=>{
  ea();if(busy||over)return;e.preventDefault();
  const b=cv.getBoundingClientRect();
  play(Math.floor((e.clientY-b.top)/S),Math.floor((e.clientX-b.left)/S));
});
$('rst').onclick=()=>{ea();if(!$('ov').classList.contains('off'))return;score=0;carry=0;if(mode)level=1;newLevel()};

newLevel();over=true;
showOv('Sauve le Roi !','👑','Tape sur 2 blocs identiques ou plus pour les faire disparaître. Fais descendre le roi jusqu’en bas ! Les rochers cèdent quand tu casses un bloc à côté. 4 blocs créent une fusée (efface une colonne), 6 une bombe, 8 un arc-en-ciel (efface une couleur). Niveau 2 : un dragon crache du feu. Niveau 3 : des pics apparaissent, détruis-les avant que le roi tombe dessus !','Jouer',()=>{over=false});
